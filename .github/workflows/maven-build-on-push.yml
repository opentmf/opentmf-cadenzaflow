name: Maven build on push

# Build, full test suite and SonarCloud analysis on every push and PR. No image
# builds here - those belong to the release workflow.

on:
  push:
    branches:
      - develop
      # Train work rides ONE branch feature/train-<n> that is pushed but not merged until
      # the cut. Without this line its pushes would run no build at all. The jobs are the
      # same as for develop; SonarCloud picks the branch name up from the Actions env.
      - 'feature/train-*'
  pull_request:
    branches:
      - develop
      - 'feature/train-*'

# Least privilege by default; each job below still declares its own block, which
# REPLACES this one rather than adding to it. This is the floor for any job added
# later without one.
permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: opentmf_opentmf-cadenzaflow

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Sonar blame data

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # `verify` runs the full suite (surefire + failsafe/Testcontainers) and the
      # hard JaCoCo gate; the appended sonar goal pushes the analysis with coverage.
      # Organization and project key come from pom.xml, so they stay in one place.
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            mvn --batch-mode verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          else
            echo "::warning::SONAR_TOKEN is not set - building without SonarCloud analysis"
            mvn --batch-mode verify
          fi

      # Informational here (the release workflow is where a red gate aborts), but the
      # new-code numbers it prints are what the zero-new-issues rule is judged on, so
      # they belong in front of the reviewer on every push - not one click away.
      - name: Sonar mini report
        if: env.SONAR_TOKEN != '' && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=${BRANCH}" \
            -o status.json
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=${BRANCH}&metricKeys=security_rating,reliability_rating,sqale_rating,vulnerabilities,bugs,code_smells,security_hotspots,coverage,duplicated_lines_density,new_coverage,new_violations,new_duplicated_lines_density" \
            -o measures.json
          python3 .github/scripts/sonar-report.py status.json measures.json \
            "${SONAR_PROJECT_KEY}" "${BRANCH}" >> "$GITHUB_STEP_SUMMARY"

  # The published API document is GENERATED: ci/merge-openapi.py merges the engine's own
  # spec artifact (at <cadenzaflow.version>) with the hand-maintained ci/openapi-service.yaml.
  # This fails when the committed file is not exactly the generator's output - after an
  # engine bump without a regeneration, or after a hand edit of the generated file
  # (CF-OPENAPI-GENERATED-IN-STEP-1). PyYAML is pinned: its dump IS the file's format.
  openapi-generated:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: The committed openapi.yaml is the generator's output
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openapi-venv"
          "$RUNNER_TEMP/openapi-venv/bin/pip" install --quiet pyyaml==6.0.3
          "$RUNNER_TEMP/openapi-venv/bin/python" ci/merge-openapi.py --check

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact
