name: Maven build on push

# Build, full test suite and SonarCloud analysis on every push and PR. No image
# builds here - those belong to the release workflow.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: opentmf_opentmf-cadenzaflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # Sonar blame data

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # `verify` runs the full suite (surefire + failsafe/Testcontainers) and the
      # hard JaCoCo gate; the appended sonar goal pushes the analysis with coverage.
      # Organization and project key come from pom.xml, so they stay in one place.
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            mvn --batch-mode verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          else
            echo "::warning::SONAR_TOKEN is not set - building without SonarCloud analysis"
            mvn --batch-mode verify
          fi

      # Informational here (the release workflow is where a red gate aborts), but the
      # new-code numbers it prints are what the zero-new-issues rule is judged on, so
      # they belong in front of the reviewer on every push - not one click away.
      - name: Sonar mini report
        if: env.SONAR_TOKEN != '' && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=${BRANCH}" \
            -o status.json
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=${BRANCH}&metricKeys=security_rating,reliability_rating,sqale_rating,vulnerabilities,bugs,code_smells,security_hotspots,coverage,duplicated_lines_density,new_coverage,new_violations,new_duplicated_lines_density" \
            -o measures.json
          python3 .github/scripts/sonar-report.py status.json measures.json \
            "${SONAR_PROJECT_KEY}" "${BRANCH}" >> "$GITHUB_STEP_SUMMARY"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0
          detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact
