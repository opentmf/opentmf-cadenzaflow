name: Build & Push Docker image on Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write   # required by softprops/action-gh-release to attach assets
  packages: write
  id-token: write   # OIDC token for keyless cosign signing

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_PROJECT_KEY: opentmf_opentmf-cadenzaflow
  SONAR_BRANCH: develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - maven-profiles: repackage
            tag-suffix: ""
            latest: "true"
          - maven-profiles: repackage,aws-iam
            tag-suffix: "-aws"
            latest: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SonarCloud analysis itself is pushed by maven-build.yml on every push
      # to develop; this workflow only reads the results back through the API.
      - name: Fetch Quality Gate for develop branch
        id: qg
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          QG_JSON=$(curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=${SONAR_BRANCH}")

          echo "$QG_JSON" > sonar-quality-gate.json
          STATUS=$(echo "$QG_JSON" | jq -r '.projectStatus.status')

          echo "quality_gate_status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "OK" ]; then
            echo "::error::Quality Gate is $STATUS on develop. Aborting release build."
            exit 1
          fi

      - name: Build Sonar mini report (develop)
        id: sonar_report
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          METRICS="security_rating,vulnerabilities,reliability_rating,bugs,sqale_rating,code_smells,accepted_issues,coverage,duplicated_lines_density,security_hotspots"

          MEAS_JSON=$(curl -sS \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=${SONAR_BRANCH}&metricKeys=${METRICS}")

          echo "$MEAS_JSON" > sonar-measures.json

          val() { echo "$MEAS_JSON" | jq -r --arg k "$1" '.component.measures[] | select(.metric==$k) | .value // "n/a"' ; }

          rate_letter() {
            case "$1" in
              1* ) echo "A" ;;
              2* ) echo "B" ;;
              3* ) echo "C" ;;
              4* ) echo "D" ;;
              5* ) echo "E" ;;
              *  ) echo "n/a" ;;
            esac
          }

          SEC_R_NUM=$(val security_rating)
          REL_R_NUM=$(val reliability_rating)
          MAI_R_NUM=$(val sqale_rating)

          SEC_R=$(rate_letter "$SEC_R_NUM")
          REL_R=$(rate_letter "$REL_R_NUM")
          MAI_R=$(rate_letter "$MAI_R_NUM")

          VULNS=$(val vulnerabilities)
          BUGS=$(val bugs)
          SMELLS=$(val code_smells)
          ACCEPTED=$(val accepted_issues)
          COVERAGE=$(val coverage)
          DUPL=$(val duplicated_lines_density)
          HOTSPOTS=$(val security_hotspots)

          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          {
            echo "# SonarQube Cloud mini report"
            echo ""
            echo "**Release tag:** \`${RELEASE_TAG:-${GITHUB_REF_NAME}}\`"
            echo "**Release commit:** \`${RELEASE_SHA}\`"
            echo "**Report time (UTC):** \`${NOW_UTC}\`"
            echo "**Source branch:** \`${SONAR_BRANCH}\`"
            echo ""
            echo "## Quality Gate"
            echo "- Status: **${{ steps.qg.outputs.quality_gate_status }}**"
            echo ""
            echo "## Software qualities"
            echo "- **Security:** rating **${SEC_R}** (raw ${SEC_R_NUM}), open issues **${VULNS}**"
            echo "- **Reliability:** rating **${REL_R}** (raw ${REL_R_NUM}), open issues **${BUGS}**"
            echo "- **Maintainability:** rating **${MAI_R}** (raw ${MAI_R_NUM}), open issues **${SMELLS}**"
            echo ""
            echo "## Other"
            echo "- **Accepted issues:** **${ACCEPTED}**"
            echo "- **Coverage:** **${COVERAGE}%**"
            echo "- **Duplications:** **${DUPL}%**"
            echo "- **Security hotspots:** **${HOTSPOTS}**"
          } > sonar-report.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Login to GHCR with PAT
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.tag-suffix }}
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}}          # 24.0.3 / 24.0.3-aws
            type=semver,pattern={{major}}.{{minor}}  # 24.0   / 24.0-aws
            type=semver,pattern={{major}}            # 24     / 24-aws
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Built from release ${{ github.ref_name }}${{ matrix.tag-suffix && format(' ({0})', matrix.tag-suffix) || '' }}

      # ---- Trivy scan -----------------------------------------------------------
      # Build one amd64 image locally per matrix leg, scan it, and only then run
      # the multi-arch build & push. The scan reports are not embedded in the
      # runtime image - they are attached to the GitHub Release page instead.

      - name: Pre-build local image for Trivy scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile_release
          push: false
          load: true
          platforms: linux/amd64
          tags: trivy-scan-target:latest
          build-args: |
            MAVEN_PROFILES=${{ matrix.maven-profiles }}
          cache-from: type=gha,scope=build${{ matrix.tag-suffix }}
          cache-to: type=gha,mode=max,scope=build${{ matrix.tag-suffix }}

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ matrix.tag-suffix }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-${{ matrix.tag-suffix }}-

      - name: Trivy scan — HTML report (all severities, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy-scan-target:latest
          format: template
          template: '@ci/trivy-html.tpl'
          output: trivy-report.html
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          trivyignores: .trivyignore
          exit-code: '0'
          cache-dir: ${{ runner.temp }}/.cache/trivy

      - name: Trivy gate — fail release on HIGH or CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy-scan-target:latest
          format: table
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          cache-dir: ${{ runner.temp }}/.cache/trivy
      # --------------------------------------------------------------------------

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile_release
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAVEN_PROFILES=${{ matrix.maven-profiles }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build${{ matrix.tag-suffix }}
          cache-to: type=gha,mode=max,scope=build${{ matrix.tag-suffix }}

      # Keyless signing: the certificate binds this workflow's GitHub OIDC
      # identity to the image; the signature lands in the public Rekor
      # transparency log. Signing the digest covers every tag pointing at it.
      - name: Sign image (keyless cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

      # Each matrix leg scans its own image and writes its own trivy-report.html.
      # The AWS leg renames it to trivy-report-aws.html before attaching, so the
      # two legs' reports don't clobber each other as release assets.
      - name: Rename Trivy report with image suffix
        if: github.event_name == 'release' && matrix.tag-suffix != ''
        shell: bash
        run: mv trivy-report.html "trivy-report${{ matrix.tag-suffix }}.html"

      - name: Attach Trivy report to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: trivy-report${{ matrix.tag-suffix }}.html

      # Sonar report is branch-based, not profile-based — identical for both legs.
      # Attached once, from the regular leg only.
      - name: Attach Sonar report to GitHub Release
        if: github.event_name == 'release' && matrix.tag-suffix == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: sonar-report.md
