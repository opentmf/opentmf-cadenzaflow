name: Build & Push Docker image on Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - maven-profiles: repackage
            tag-suffix: ""
            latest: "true"
          - maven-profiles: repackage,aws-iam
            tag-suffix: "-aws"
            latest: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR with PAT
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.tag-suffix }}
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}}          # 24.0.3 / 24.0.3-aws
            type=semver,pattern={{major}}.{{minor}}  # 24.0   / 24.0-aws
            type=semver,pattern={{major}}            # 24     / 24-aws
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Built from release ${{ github.ref_name }}${{ matrix.tag-suffix && format(' ({0})', matrix.tag-suffix) || '' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_release
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAVEN_PROFILES=${{ matrix.maven-profiles }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build${{ matrix.tag-suffix }}
          cache-to: type=gha,mode=max,scope=build${{ matrix.tag-suffix }}
