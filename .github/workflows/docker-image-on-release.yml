name: Docker image on Release

# One SonarCloud gate for the whole workflow, then a flavour x architecture build
# matrix, then one merge job per flavour that assembles the manifest list and signs
# it. EVERY action is pinned by full commit SHA with the version as a trailing
# comment, GitHub-owned actions/* included: a mutable tag would let a compromised
# action release run with this workflow's packages:write / id-token:write tokens,
# and "it is the same trust root as the runner" argues for trusting the publisher,
# not for trusting whatever a tag points at on the day this runs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build images for, e.g. 1.1.0. Leave empty to run
          against the ref this was dispatched from. This exists because a release-
          triggered run uses the workflow file AS IT WAS AT THE TAG: when a released
          workflow turns out to be broken, neither re-running it nor dispatching against
          the tag can pick up the fix. Dispatching from the fixed branch WITH this input
          builds the tagged source through the fixed workflow, and attaches the reports
          to the existing release. 1.1.0 needed exactly this.
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>
  # The release being built: the dispatch input when given, otherwise the triggering
  # ref. Every step that needs the tag - source checkout, image tags, asset upload -
  # reads this one variable, so a dispatched rebuild cannot half-target the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # True when there is a real release page to attach assets to.
  HAS_RELEASE: ${{ github.event_name == 'release' || inputs.tag != '' }}
  SONAR_PROJECT_KEY: opentmf_opentmf-cadenzaflow
  # Releases are cut from `develop` - this repository's default and only
  # long-lived branch. One variable for every Sonar call, because the gate and
  # the report must describe the SAME branch: spelling the name out per call is
  # what once let the report quote `main`'s measures under a `develop` heading.
  SONAR_BRANCH: develop
  TRIVY_VERSION: 0.72.0
  # The cosign BINARY version, pinned in one place because two jobs now install it:
  # the build legs attest a per-architecture SBOM, the merge job signs the index.
  # A split between them would sign and attest the same release with two majors.
  COSIGN_VERSION: v2.6.1

jobs:
  # ---------------------------------------------------------------------------
  # The gate runs ONCE for the whole workflow (not once per flavour) and every
  # build job depends on it, so a red quality gate stops the release before any
  # image is built.
  # ---------------------------------------------------------------------------
  sonar-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # checkout + attach sonar-report.md as a release asset
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Quality gate + mini report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is not set - the release gate cannot be evaluated"
            exit 1
          fi
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=${SONAR_BRANCH}" \
            -o status.json
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=${SONAR_BRANCH}&metricKeys=security_rating,reliability_rating,sqale_rating,vulnerabilities,bugs,code_smells,security_hotspots,coverage,duplicated_lines_density,new_coverage,new_violations,new_duplicated_lines_density" \
            -o measures.json
          python3 .github/scripts/sonar-report.py status.json measures.json \
            "${SONAR_PROJECT_KEY}" "${SONAR_BRANCH}" > sonar-report.md
          cat sonar-report.md >> "$GITHUB_STEP_SUMMARY"
          test "$(python3 -c 'import json;print(json.load(open("status.json"))["projectStatus"]["status"])')" = "OK" \
            || { echo "::error::SonarCloud quality gate is not OK - aborting the release"; exit 1; }

      # Uploaded with the preinstalled gh CLI rather than a third-party release
      # action: one less action to SHA-pin and keep current.
      - name: Attach the report to the release
        if: env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "$TAG" sonar-report.md --clobber

  # ---------------------------------------------------------------------------
  # One job per (flavour, architecture). Each pushes an UNTAGGED by-digest image
  # and is Trivy-gated on that exact image, so every architecture that can end up
  # in a tagged manifest has been scanned - the single-job pattern this replaces
  # scanned only amd64 while shipping an arm64 nobody looked at.
  # ---------------------------------------------------------------------------
  build:
    needs: sonar-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read    # checkout
      packages: write   # push the by-digest images
      id-token: write   # keyless cosign attest of this leg's SBOM (Fulcio OIDC)
    strategy:
      fail-fast: false
      matrix:
        flavour: [base, aws, azure]
        include:
          - flavour: base
            maven-profiles: repackage
            tag-suffix: ""
            latest: "true"
          - flavour: aws
            maven-profiles: repackage,aws
            tag-suffix: "-aws"
            latest: "false"
          - flavour: azure
            maven-profiles: repackage,azure
            tag-suffix: "-azure"
            latest: "false"
        arch: [amd64, arm64]
        # pia-team/opentmf are on GitHub Free, where hosted ubuntu-*-arm runners are
        # free for PUBLIC repos only - a private repo scheduling that label queues
        # forever. So arm64 builds QEMU-emulated on an amd64 runner. Going native
        # later is a two-line change here: runner label + emulated flag.
        runner: [ubuntu-latest]
        emulated: [true]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        if: matrix.emulated && matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # A PAT, not GITHUB_TOKEN: the ghcr.io/opentmf/opentmf-cadenzaflow package is
      # org-owned and PRIVATE, and does not grant this repository's GITHUB_TOKEN write
      # access - buildx fails at push with `denied: permission_denied: read_package`
      # however much `packages: write` the job declares. 1.1.0 was released with
      # GITHUB_TOKEN here and every build leg failed. To drop the PAT later, give the
      # repository write access under the package's "Manage Actions access" first, and
      # prove it on a pre-release tag before trusting a real release to it.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile_release
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MAVEN_PROFILES=${{ matrix.maven-profiles }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Built from release ${{ env.RELEASE_TAG }} (${{ matrix.flavour }})
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.flavour }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavour }}-${{ matrix.arch }}

      # --platform is REQUIRED, not decoration: the image is scanned remotely by digest,
      # and for a remote index Trivy defaults to the RUNNER's platform (linux/amd64).
      # A by-digest push produces an index carrying only this leg's architecture, so on
      # the arm64 legs Trivy looked for an amd64 child, found none, and died with
      # "no child with platform linux/amd64 in index". The amd64 legs passed only
      # because the default happened to match - which is how three arm64 legs failed
      # while their amd64 twins went green.
      - name: Trivy gate (this architecture's own image)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v trivy-cache:/root/.cache/trivy \
            -v "${PWD}:/work" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --platform "linux/${{ matrix.arch }}" \
            --timeout 15m --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /work/.trivyignore \
            "${IMAGE_REF}"

      # The SBOM is generated and attested HERE, per (flavour, architecture), rather
      # than once against the merged index in the merge job. An index-level SBOM had
      # the same defect the HTML reports used to have: Trivy resolves an index to a
      # SINGLE child, so one SBOM described amd64 while being attested to the whole
      # index - an arm64 consumer verifying the attestation got an accurate-looking
      # component list for an image they do not run. A leg's by-digest image IS one
      # architecture, so the SBOM and its subject cannot disagree.
      #
      # Trade-off, deliberate: attestations now hang off the per-architecture child
      # digests instead of the index, so `cosign verify-attestation` against the TAG
      # no longer finds one - resolve the tag to its child for your platform first.
      # A wrong SBOM discoverable at the tag is worse than a right one a step away.
      #
      # The scan target is the same remote by-digest ref the gate just read, with the
      # same warm cache mount, so this costs a second read of a cached image, not a
      # second build. --platform for the reason spelled out above the gate.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Generate this architecture's CycloneDX SBOM
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v trivy-cache:/root/.cache/trivy \
            -v "${PWD}:/out" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --platform "linux/${{ matrix.arch }}" \
            --timeout 15m --format cyclonedx --output /out/sbom.cdx.json \
            "${IMAGE_REF}"

      - name: Attest the SBOM to this architecture's image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cdx.json "${IMAGE_REF}"

      # The merge job cannot read matrix outputs, so each leg leaves its digest as
      # an artifact for the matching flavour to collect.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The bare hex, without the `sha256:` prefix: a colon is not a valid
          # artifact filename. The merge job puts the prefix back.
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.flavour }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Per flavour: assemble the per-arch digests into the tagged manifest list, then
  # sign and attest THAT index digest. Signing a per-arch image or a tag instead
  # would leave the artifact consumers actually pull unverifiable.
  # ---------------------------------------------------------------------------
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaching the Trivy report as a release asset
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: base
            tag-suffix: ""
            latest: "true"
          - flavour: aws
            tag-suffix: "-aws"
            latest: "false"
          - flavour: azure
            tag-suffix: "-azure"
            latest: "false"
    steps:
      # Needed for the Trivy report step below: it mounts the workspace at /work
      # and reads ci/trivy-html.tpl and .trivyignore from it. Without a checkout
      # the mount is empty and Trivy aborts on the missing template - after the
      # tagged manifest has already been pushed and signed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download this flavour's digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.flavour }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Same PAT as the build job - see the note there.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      # Installed BEFORE the manifest list is created, deliberately. Creating the
      # list PUBLISHES the tag; signing happens after. Anything that can fail in
      # between leaves a real, pullable, UNSIGNED tag behind - which is exactly what
      # happened on 1.1.0-azure, when this action's download returned HTTP 22 and the
      # tag sat unsigned until the job was re-run. Front-loading the one step that
      # reaches out to a third-party release server shrinks that window to the
      # registry calls themselves.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # PINNED DELIBERATELY, and the pin is on the cosign BINARY, not on the
          # installer. The installer's own default moved from cosign v2.5.2 to v3.0.6
          # in its v4, so taking the installer upgrade for the Node 24 runtime would
          # ALSO swap the signing binary for a new major - quietly, in a commit whose
          # stated purpose is clearing deprecation warnings. cosign 3 changes how
          # signatures are attached and discovered, so anyone verifying our images
          # could start failing. Moving to cosign 3 is a supply-chain decision that
          # deserves its own change and its own verification pass, not a side effect.
          # v2.6.1 is the version the rest of the estate pins; still cosign 2, so the
          # signature format is identical to what signed 1.0.x through 1.1.2.
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.tag-suffix }},onlatest=true
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}          # 1.0.0 / 1.0.0-aws
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}  # 1.0   / 1.0-aws
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}            # 1     / 1-aws

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      - name: Resolve the index digest
        id: index
        run: |
          set -euo pipefail
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{ json .Manifest.Digest }}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign the index (keyless)
        env:
          INDEX_REF: ${{ steps.index.outputs.ref }}
        run: cosign sign --yes "$INDEX_REF"

      # NO SBOM step here any more. It used to generate one from the index without
      # --platform and attest it to the whole index, which described amd64 while
      # claiming to cover every architecture - the same defect the HTML reports had.
      # Each build leg now generates and attests its OWN architecture's SBOM against
      # its by-digest image, where the subject and the contents cannot disagree. This
      # job still signs the index, because a signature says "this is ours" about the
      # thing consumers actually pull, and that IS the index.

      # A readable report of EVERY severity, not just the gated ones, so a reviewer
      # can see what shipped rather than only what blocked. Never fails the build -
      # the gate in the build jobs is what decides that.
      #
      # ONE REPORT PER ARCHITECTURE, because Trivy resolves an index to a SINGLE
      # child: without --platform it picks the runner's, so a single report against
      # the index silently described amd64 while claiming to cover the tag. An arm64
      # operator was reading about an image they do not run. The architectures are
      # spelled out here rather than derived, so they must be kept in step with the
      # build job's `arch:` matrix.
      #
      # Expect the two reports to come out IDENTICAL apart from timestamps, and do not
      # "fix" that: the OS findings are Debian/Ubuntu source-package CVEs, which are
      # tracked per source package and not per architecture, and the Java layers are
      # byte-identical across arches. Checked on 1.1.0 - the platforms resolve to
      # genuinely different children (distinct ImageIDs, each reporting its own
      # architecture) that happen to carry the same 25 vulnerabilities. The split
      # earns its keep the day they diverge, and until then it makes the arm64 report
      # demonstrably about the arm64 image.
      - name: Trivy HTML reports (one per architecture)
        env:
          INDEX_REF: ${{ steps.index.outputs.ref }}
          SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker run --rm \
              -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
              -v "${PWD}:/work" \
              "aquasec/trivy:${TRIVY_VERSION}" image \
              --platform "linux/${arch}" \
              --timeout 15m --format template --template "@/work/ci/trivy-html.tpl" \
              --ignorefile /work/.trivyignore \
              --output "/work/trivy-report${SUFFIX}-${arch}.html" \
              "$INDEX_REF"
          done

      - name: Attach the Trivy reports to the release
        if: env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gh release upload "$TAG" "trivy-report${SUFFIX}-${arch}.html" --clobber
          done
