name: Docker image on Release

# One SonarCloud gate for the whole workflow, then a flavour x architecture build
# matrix, then one merge job per flavour that assembles the manifest list and signs
# it. Third-party actions are pinned by full commit SHA with the version as a
# trailing comment: a mutable tag would let a compromised action release run with
# this workflow's packages:write / id-token:write tokens. GitHub-owned actions/*
# stay on version tags - same trust root as the runner itself.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build images for, e.g. 1.1.0. Leave empty to run
          against the ref this was dispatched from. This exists because a release-
          triggered run uses the workflow file AS IT WAS AT THE TAG: when a released
          workflow turns out to be broken, neither re-running it nor dispatching against
          the tag can pick up the fix. Dispatching from the fixed branch WITH this input
          builds the tagged source through the fixed workflow, and attaches the reports
          to the existing release. 1.1.0 needed exactly this.
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>
  # The release being built: the dispatch input when given, otherwise the triggering
  # ref. Every step that needs the tag - source checkout, image tags, asset upload -
  # reads this one variable, so a dispatched rebuild cannot half-target the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # True when there is a real release page to attach assets to.
  HAS_RELEASE: ${{ github.event_name == 'release' || inputs.tag != '' }}
  SONAR_PROJECT_KEY: opentmf_opentmf-cadenzaflow
  # Releases are cut from `develop` - this repository's default and only
  # long-lived branch. One variable for every Sonar call, because the gate and
  # the report must describe the SAME branch: spelling the name out per call is
  # what once let the report quote `main`'s measures under a `develop` heading.
  SONAR_BRANCH: develop
  TRIVY_VERSION: 0.72.0

jobs:
  # ---------------------------------------------------------------------------
  # The gate runs ONCE for the whole workflow (not once per flavour) and every
  # build job depends on it, so a red quality gate stops the release before any
  # image is built.
  # ---------------------------------------------------------------------------
  sonar-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # checkout + attach sonar-report.md as a release asset
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Quality gate + mini report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is not set - the release gate cannot be evaluated"
            exit 1
          fi
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=${SONAR_BRANCH}" \
            -o status.json
          curl -sSf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=${SONAR_BRANCH}&metricKeys=security_rating,reliability_rating,sqale_rating,vulnerabilities,bugs,code_smells,security_hotspots,coverage,duplicated_lines_density,new_coverage,new_violations,new_duplicated_lines_density" \
            -o measures.json
          python3 .github/scripts/sonar-report.py status.json measures.json \
            "${SONAR_PROJECT_KEY}" "${SONAR_BRANCH}" > sonar-report.md
          cat sonar-report.md >> "$GITHUB_STEP_SUMMARY"
          test "$(python3 -c 'import json;print(json.load(open("status.json"))["projectStatus"]["status"])')" = "OK" \
            || { echo "::error::SonarCloud quality gate is not OK - aborting the release"; exit 1; }

      # Uploaded with the preinstalled gh CLI rather than a third-party release
      # action: one less action to SHA-pin and keep current.
      - name: Attach the report to the release
        if: env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "$TAG" sonar-report.md --clobber

  # ---------------------------------------------------------------------------
  # One job per (flavour, architecture). Each pushes an UNTAGGED by-digest image
  # and is Trivy-gated on that exact image, so every architecture that can end up
  # in a tagged manifest has been scanned - the single-job pattern this replaces
  # scanned only amd64 while shipping an arm64 nobody looked at.
  # ---------------------------------------------------------------------------
  build:
    needs: sonar-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read    # checkout
      packages: write   # push the by-digest images
    strategy:
      fail-fast: false
      matrix:
        flavour: [base, aws, azure]
        include:
          - flavour: base
            maven-profiles: repackage
            tag-suffix: ""
            latest: "true"
          - flavour: aws
            maven-profiles: repackage,aws
            tag-suffix: "-aws"
            latest: "false"
          - flavour: azure
            maven-profiles: repackage,azure
            tag-suffix: "-azure"
            latest: "false"
        arch: [amd64, arm64]
        # pia-team/opentmf are on GitHub Free, where hosted ubuntu-*-arm runners are
        # free for PUBLIC repos only - a private repo scheduling that label queues
        # forever. So arm64 builds QEMU-emulated on an amd64 runner. Going native
        # later is a two-line change here: runner label + emulated flag.
        runner: [ubuntu-latest]
        emulated: [true]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        if: matrix.emulated && matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # A PAT, not GITHUB_TOKEN: the ghcr.io/opentmf/opentmf-cadenzaflow package is
      # org-owned and PRIVATE, and does not grant this repository's GITHUB_TOKEN write
      # access - buildx fails at push with `denied: permission_denied: read_package`
      # however much `packages: write` the job declares. 1.1.0 was released with
      # GITHUB_TOKEN here and every build leg failed. To drop the PAT later, give the
      # repository write access under the package's "Manage Actions access" first, and
      # prove it on a pre-release tag before trusting a real release to it.
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile_release
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MAVEN_PROFILES=${{ matrix.maven-profiles }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Built from release ${{ env.RELEASE_TAG }} (${{ matrix.flavour }})
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.flavour }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavour }}-${{ matrix.arch }}

      - name: Trivy gate (this architecture's own image)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v trivy-cache:/root/.cache/trivy \
            -v "${PWD}:/work" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --timeout 15m --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /work/.trivyignore \
            "${IMAGE_REF}"

      # The merge job cannot read matrix outputs, so each leg leaves its digest as
      # an artifact for the matching flavour to collect.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The bare hex, without the `sha256:` prefix: a colon is not a valid
          # artifact filename. The merge job puts the prefix back.
          touch "/tmp/digests/${DIGEST#sha256:}"
        shell: bash

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.flavour }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Per flavour: assemble the per-arch digests into the tagged manifest list, then
  # sign and attest THAT index digest. Signing a per-arch image or a tag instead
  # would leave the artifact consumers actually pull unverifiable.
  # ---------------------------------------------------------------------------
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaching the Trivy report as a release asset
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: base
            tag-suffix: ""
            latest: "true"
          - flavour: aws
            tag-suffix: "-aws"
            latest: "false"
          - flavour: azure
            tag-suffix: "-azure"
            latest: "false"
    steps:
      # Needed for the Trivy report step below: it mounts the workspace at /work
      # and reads ci/trivy-html.tpl and .trivyignore from it. Without a checkout
      # the mount is empty and Trivy aborts on the missing template - after the
      # tagged manifest has already been pushed and signed.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download this flavour's digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.flavour }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Same PAT as the build job - see the note there.
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.tag-suffix }},onlatest=true
            latest=${{ matrix.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}          # 1.0.0 / 1.0.0-aws
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}  # 1.0   / 1.0-aws
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}            # 1     / 1-aws

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      - name: Resolve the index digest
        id: index
        run: |
          set -euo pipefail
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{ json .Manifest.Digest }}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the index (keyless)
        env:
          INDEX_REF: ${{ steps.index.outputs.ref }}
        run: cosign sign --yes "$INDEX_REF"

      - name: Generate the CycloneDX SBOM
        env:
          INDEX_REF: ${{ steps.index.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v "${PWD}:/out" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --timeout 15m --format cyclonedx --output /out/sbom.cdx.json \
            "$INDEX_REF"

      - name: Attest the SBOM to the index
        env:
          INDEX_REF: ${{ steps.index.outputs.ref }}
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cdx.json "$INDEX_REF"

      # A readable report of EVERY severity, not just the gated ones, so a reviewer
      # can see what shipped rather than only what blocked. Never fails the build -
      # the gate in the build jobs is what decides that. Written against the merged
      # index, so one report covers every architecture.
      - name: Trivy HTML report
        env:
          INDEX_REF: ${{ steps.index.outputs.ref }}
          SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            -v "${PWD}:/work" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --timeout 15m --format template --template "@/work/ci/trivy-html.tpl" \
            --ignorefile /work/.trivyignore \
            --output "/work/trivy-report${SUFFIX}.html" \
            "$INDEX_REF"

      - name: Attach the Trivy report to the release
        if: env.HAS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          gh release upload "$TAG" "trivy-report${SUFFIX}.html" --clobber
