---
opentmf:
  security:
    jwk-set-uri: ${plugin.identity.keycloak.keycloak-issuer-url}/protocol/openid-connect/certs
    user-claim: email
    authorities-claim: groups
    secure-endpoints:
      - method: GET
        path: /engine-rest/**
        roles:
          - reader
          - writer
          - admin
      - method: POST
        path: /engine-rest/**
        roles:
          - writer
          - admin
      - method: PUT
        path: /engine-rest/**
        roles:
          - writer
          - admin
      - method: DELETE
        path: /engine-rest/**
        roles:
          - writer
          - admin

    whitelist:
      - /error
      - /cadenzaflow/**
      - /engine-rest/external-task/**

    # Actuator runs on the separate management port (16000); since
    # openid-rbac-security 2.x it is governed by this dedicated block, not by the
    # main-port whitelist/secure-endpoints above. Anything not listed here falls
    # back to other-endpoints: AUTHENTICATED (valid JWT required).
    management:
      whitelist:
        - /actuator
        - /actuator/health
        - /actuator/health/**
        - /actuator/info
        - /actuator/metrics
        - /actuator/metrics/**
        - /actuator/loggers
        - /actuator/loggers/**
        - /actuator/prometheus
      secure-endpoints:
        - method: GET
          path: /actuator/env
          roles:
            - admin
        - method: GET
          path: /actuator/env/**
          roles:
            - admin
