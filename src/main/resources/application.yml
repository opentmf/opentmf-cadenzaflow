---
spring:
  # Activated ONLY when nothing else is. Everything this image ships that a
  # DEPLOYMENT ought to own - the whole `opentmf.security` block in
  # config-security.yml, and the role-bearing actuator settings below - is gated
  # on this profile, so a platform that sets SPRING_PROFILES_ACTIVE becomes the
  # sole author of its own security rather than inheriting ours.
  #
  # Deliberately NOT a Dockerfile ENV: an ENV expresses "the image's opinion",
  # which a deployment must know about to replace. `spring.profiles.default`
  # expresses "the default when nobody has an opinion", and switches itself off
  # the moment a deployment activates any profile at all - without the
  # deployment having to know this file exists. See
  # docs/deployment-owns-security-plan.md §3.1.
  profiles:
    default: standalone
  autoconfigure:
    exclude:
    - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  application:
    name: OpenTmfCadenzaFlow
  config:
    import:
      - config-cadenzaflow.yml
      - config-security.yml
  servlet:
    multipart:
      enabled: false
  datasource:
    url: jdbc:postgresql://postgresql:5432/db?useUnicode=yes&characterEncoding=UTF-8&currentSchema=cadenzaflow
    username: cadenzaflow
    hikari:
      schema: cadenzaflow
      auto-commit: false
      connection-timeout: 30000
      idle-timeout: 1800000
      max-lifetime: 2400000
      minimum-idle: 5
      # Sized for real external-task load rather than a demo: roughly 100 tasks in
      # flight across a worker fleet, whose completes and fetches are what actually
      # draw connections (a parked long poll holds a socket, not a connection).
      #
      # This is ALSO a floor, not just a throughput knob. The job executor can run
      # max-pool-size threads plus a separate acquisition thread, so a pod that runs
      # jobs needs strictly more connections than that - at the previous 10 against
      # 10 job threads the acquisition thread could be starved by its own workers.
      # Keep this above cadenzaflow.bpm.job-execution.max-pool-size + 1.
      #
      # BUDGET: this is a per-pod maximum. Multiply by the number of pods (both
      # deployments, if you split them per README 9.5) and keep the total, plus every
      # other client, under the database's max_connections - PostgreSQL ships 100.
      maximum-pool-size: 30
      pool-name: cadenzaflow-pool

server:
  port: 8080
  servlet:
    context-path: /cadenzaflow/v1
    jsp:
      registered: false
  shutdown: graceful
  ssl:
    enabled: false
  tomcat:
    max-http-form-post-size: 10MB
  max-http-request-header-size: 8KB

management:
  endpoints:
    access:
      default: read_only
    web:
      exposure:
        include:
          - health
          - metrics
          - loggers
          - env
          - prometheus
  endpoint:
    # `management.endpoint.env.*` is deliberately absent here and set only under
    # the standalone profile at the foot of this file. Its `roles` name THIS
    # project's vocabulary (reader/writer/admin), which is meaningless to a
    # consumer, and Spring Boot reads an EMPTY roles list as "every
    # authenticated user is authorized" - so shipping the roles ungated would
    # hand a deployment unsanitized env values (datasource credentials among
    # them) for any authenticated caller that reaches the endpoint. Left unset,
    # Boot's own default `show-values: never` applies and values stay masked
    # until the deployment opts in.
    loggers:
      access: unrestricted
    health:
      probes:
        enabled: true
      show-details: always
  server:
    base-path: /
    port: 16000

---
# Standalone only - see `spring.profiles.default` at the head of this file.
# A deployment that activates any profile gets Boot's defaults here and decides
# for itself who may read unsanitized environment values.
spring:
  config:
    activate:
      on-profile: standalone

management:
  endpoint:
    env:
      show-values: when_authorized
      roles:
        - admin
