---
# Browser-facing Keycloak URL. Defaults to the server-to-server issuer URL.
# Override via KEYCLOAK_URL_AUTH when browsers reach Keycloak at a different
# address than the application (e.g. Citrix, split-DNS, external Ingress).
keycloak.url.auth: ${plugin.identity.keycloak.keycloak-issuer-url}

cadenzaflow.bpm:
  # How OBJECT process variables are serialized when the caller does not name a
  # format. The engine's own default is application/x-java-serialized-object, which
  # stores a Java-serialized blob: unreadable in Cockpit, unreadable to the external
  # task workers and dnms services that are not Java, and a deserialization sink on
  # the way back in. JSON is readable by every consumer and needs no shared classes.
  # Spin's JSON dataformat is already on the classpath, so nothing else is required.
  default-serialization-format: application/json
  authorization:
    enabled: true
  database:
    type: postgres
    schema-update: true
    schema-name: ${spring.datasource.hikari.schema}
    table-prefix: ${spring.datasource.hikari.schema}.
  filter:
    create: All tasks
  # Job executor sizing. These govern the engine's OWN background work - timers,
  # async continuations, retries, history cleanup - not external tasks, which are
  # pulled by worker services and are bounded by the worker fleet instead.
  #
  # Raised from the starter defaults (3 / 10 / 3 / 3) so a pod can absorb a burst of
  # async continuations without rejecting them. max-pool-size must stay comfortably
  # below spring.datasource.hikari.maximum-pool-size: every job thread holds a
  # connection while it runs, and the acquisition thread needs one of its own.
  #
  # max-jobs-per-acquisition is deliberately equal to queue-capacity: acquired jobs
  # are handed to the queue, so acquiring more per cycle than the queue can hold is
  # what produces `cadenzaflow.engine.job.execution.rejected` - the meter to watch if
  # you raise it further.
  job-execution:
    core-pool-size: 5
    max-pool-size: 12
    queue-capacity: 10
    max-jobs-per-acquisition: 10
  rest-api:
    fetch-and-lock:
      # How many NEWLY ARRIVING long-poll registrations can queue between handler
      # cycles before the engine answers HTTP 500 "too many requests at the same
      # time". It is a burst limiter, not a steady-state cap, and the realistic
      # trigger is a whole worker fleet reconnecting after an engine restart - so it
      # wants headroom well above the number of workers, not equal to it.
      queue-capacity: 1000
  generic-properties:
    properties:
      # The DEFAULT retention for a finished process instance, applied only to
      # definitions that do not state their own. A definition ALWAYS wins: set
      # camunda:historyTimeToLive on the process element, or PUT
      # /process-definition/{id}/history-time-to-live at runtime, and that value
      # is used instead - longer or shorter, per definition.
      #
      # Keeping a default here is also what lets a definition WITHOUT the
      # attribute deploy at all: since 7.20 the engine rejects a TTL-less
      # definition only when no default is configured.
      historyTimeToLive: P30D
      legacyJobRetryBehaviorEnabled: true
      # History cleanup - without a batch window the cleanup job is never
      # scheduled and TTLs are decorative. Times are in the JVM timezone,
      # which the Docker image pins to UTC. Cleanup jobs are cluster-safe:
      # they are acquired via the shared database, so multiple pods never
      # run the same job twice, and degree-of-parallelism is cluster-wide.
      historyCleanupBatchWindowStartTime: "01:00"
      historyCleanupBatchWindowEndTime: "05:00"
      historyCleanupDegreeOfParallelism: 2
      batchOperationHistoryTimeToLive: P30D
  oauth2:
    sso-logout:
      enabled: true
      postLogoutRedirectUri: "{baseUrl}/app/"
  webapp:
    application-path: /
    header-security:
      content-security-policy-value: "base-uri 'self';
                                        script-src $NONCE 'strict-dynamic' 'unsafe-eval' https: 'self' 'unsafe-inline';
                                        style-src 'unsafe-inline' 'self';
                                        connect-src ${keycloak.url.auth} 'self';
                                        default-src 'self';
                                        img-src 'self' data:;
                                        block-all-mixed-content;form-action 'self';
                                        frame-ancestors 'none';object-src 'none';
                                        sandbox allow-forms allow-scripts allow-same-origin allow-popups allow-downloads"

# The service's own incident-operations endpoints, mounted inside the engine REST
# application (/engine-rest/extensions/incident/groups, .../groups/retry, /engine-rest/extensions/incident).
cadenzaflow.incidents:
  retry:
    # Ids per engine batch for a group retry. One batch per chunk, so a failing
    # chunk does not stall the others. Batch THROUGHPUT is governed separately by
    # the engine's invocations-per-batch-job / batch-jobs-per-seed tuning.
    chunk-size: 20000

# TMF-630 paging for /engine-rest/extensions/incident — the toolkit's estate-standard keys
# (default-limit 50, max-limit 500, strict-mode true are the shipped defaults and are
# not restated). The allowlist names every sort field the list accepts; an unknown
# name is a 400. It must stay in step with IncidentSortMapping.
opentmf.tmf630:
  paging:
    sort-allowlist:
      - id
      - incidentTimestamp
      - incidentType
      - incidentMessage
      - activityId
      - processInstanceId
      - processDefinitionId
      - executionId
      - causeIncidentId
      - rootCauseIncidentId
      - configuration
      - tenantId

# Identity provider selection: 'keycloak' (default) or 'entra'. The engine mounts
# exactly one identity provider; the switch makes them mutually exclusive.
plugin.identity.provider: keycloak

# Entra ID (Azure AD) alternative - activate with plugin.identity.provider: entra.
# Requires an app registration with application permissions User.Read.All +
# GroupMember.Read.All (admin consent granted). SSO-only: no password/form login.
# plugin.identity.entra:
#   tenant-id: <directory (tenant) id>
#   client-id: <app registration client id>
#   client-secret: <secret>
#   use-email-as-camunda-user-id: true
#   fallback-to-upn-when-mail-empty: true
#   use-group-display-name-as-camunda-group-id: true
#   transitive-group-membership: true
#   security-groups-only: true
#   administrator-group-name: camunda-admin
#   cache-enabled: true

plugin.identity.keycloak:
  keycloak-issuer-url: http://keycloak.iam-dev.svc.cluster.local/realms/devtest
  keycloak-admin-url: http://keycloak.iam-dev.svc.cluster.local/admin/realms/devtest
  client-id: xxx
  client-secret: xxx
  use-username-as-camunda-user-id: false
  use-email-as-camunda-user-id: true
  use-group-path-as-camunda-group-id: true
  administrator-group-name: camunda-admin
  cache-enabled: true

# Webapp SSO client. The registration id is deliberately provider-NEUTRAL ('oidc'):
# it is user-visible in /oauth2/authorization/{id} and on Spring's generated login
# page, so a provider-specific id would advertise "keycloak" on an Entra deployment.
# The defaults below describe Keycloak; override the provider endpoints (and
# client-id/secret) to point the same registration at Entra ID - see
# docs/entra-azure-setup-and-testing-guide.md.
spring.security.oauth2:
  client:
    registration:
      oidc:
        provider: oidc
        client-id: ${plugin.identity.keycloak.client-id}
        client-secret: ${plugin.identity.keycloak.client-secret}
        authorization-grant-type: authorization_code
        redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
        scope: openid, profile, email
    provider:
      oidc:
        authorization-uri: ${keycloak.url.auth}/protocol/openid-connect/auth
        token-uri: ${plugin.identity.keycloak.keycloak-issuer-url}/protocol/openid-connect/token
        jwk-set-uri: ${plugin.identity.keycloak.keycloak-issuer-url}/protocol/openid-connect/certs
        user-info-uri: ${plugin.identity.keycloak.keycloak-issuer-url}/protocol/openid-connect/userinfo
        user-name-attribute: ${opentmf.security.user-claim}

