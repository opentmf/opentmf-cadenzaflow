spring:
  datasource:
    url: jdbc:tc:postgresql:18.0-alpine:///db
    hikari:
      schema: public

plugin.identity.keycloak:
  client-id: camunda-identity-service
  client-secret: A0IywtglmzU69s0fD2044EDer4iptaGG
  use-username-as-camunda-user-id: false
  use-email-as-camunda-user-id: true
  use-group-path-as-camunda-group-id: true
  administrator-group-name: camunda-admin
  cache-enabled: true

management:
  server:
    port: -1

opentmf:
  security:
    # Since 1.3.0 the `it` profile is a DEPLOYMENT like any other: activating any profile
    # switches off `standalone`, so the image contributes nothing here and this file is the
    # sole author of the ACL. Everything below used to arrive from config-security.yml on the
    # classpath - which is precisely the coupling that release removed, and these ITs were
    # themselves relying on it.
    #
    # Kept deliberately in this project's TEST role vocabulary (`ebu-federation-*`) rather than
    # the standalone `reader`/`writer`/`admin`, so the suite exercises the same shape a real
    # consumer has: its own names, authored by itself.
    jwk-set-uri: ${plugin.identity.keycloak.keycloak-issuer-url}/protocol/openid-connect/certs
    user-claim: email
    authorities-claim: groups
    whitelist:
      - /error
      - /engine-rest/external-task/**
    management:
      whitelist:
        - /actuator
        - /actuator/health
        - /actuator/health/**
        - /actuator/metrics
        - /actuator/metrics/**
        - /actuator/prometheus
      secure-endpoints:
        - method: POST
          path: /actuator/loggers/**
          roles:
            - ebu-federation-admin
        - method: GET
          path: /actuator/env
          roles:
            - ebu-federation-admin
        - method: GET
          path: /actuator/env/**
          roles:
            - ebu-federation-admin
    secure-endpoints:
      # First match wins - the specific retry rule must precede the wildcards,
      # mirroring config-security.yml.
      - method: POST
        path: /engine-rest/extensions/incident/retry
        roles:
          - ebu-federation-writer
          - ebu-federation-admin
      - method: GET
        path: /engine-rest/**
        roles:
          - ebu-federation-reader
          - ebu-federation-writer
          - ebu-federation-admin
      - method: POST
        path: /engine-rest/**
        roles:
          - ebu-federation-writer
          - admin
      - method: PUT
        path: /engine-rest/**
        roles:
          - ebu-federation-writer
          - ebu-federation-admin
      - method: DELETE
        path: /engine-rest/**
        roles:
          - ebu-federation-writer
          - ebu-federation-admin
