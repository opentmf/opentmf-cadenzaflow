# IT classes run in per-class failsafe forks; inside a fork, keep class- and
# method-level execution sequential so container/engine state is never shared
# between concurrently running tests.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread

# NOTE: no per_class lifecycle default (donor deviation) - this suite relies on
# per-method instances for fresh mocks/SecurityContext state.

# Picks up service-loader-registered JUnit Jupiter extensions.
junit.jupiter.extensions.autodetection.enabled = true
